# The demo site on GitHub Pages: the documentation of every model in linked-archi/sample-models, generated by this
# revision of rdf2docs. Run by each release, and by hand from the Actions tab.
#
# Needs, once: Settings → Pages → Source: GitHub Actions.
name: Demo site

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        run: ./gradlew shadowJar

      - name: Document every sample model
        run: playground/run-sample.sh

      - name: One site, a folder per model
        run: |
          mkdir -p _site
          items=""
          for out in playground/out/*/; do
            name=$(basename "$out")
            cp -r "$out/html" "_site/$name"
            cp -r "$out"/ai-context* "_site/$name/"   # ai-context.md, and ai-context/ for a graph of several models
            title=$(sed -n 's:.*<h1>\(.*\)</h1>.*:\1:p' "_site/$name/index.html" | head -1)   # the model's name
            items="$items<li><a href=\"$name/index.html\">${title:-$name}</a> — <a href=\"$name/ai-context.md\">AI context</a></li>"
          done
          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>rdf2docs demo</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:44rem;margin:3rem auto;padding:0 1rem}a{color:#0b57d0}</style>
          </head><body>
          <h1>rdf2docs demo</h1>
          <p>The documentation <a href="https://github.com/linked-archi/rdf2docs">rdf2docs</a> generates from the models in
          <a href="https://github.com/linked-archi/sample-models">linked-archi/sample-models</a>.</p>
          <ul>$items</ul>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
