# The demo site on GitHub Pages: the documentation of every model in linked-archi/sample-models, generated by this
# revision of rdf2docs. Run by each release, and by hand from the Actions tab.
#
# Needs, once: Settings → Pages → Source: GitHub Actions; and, since a release deploys it from its tag,
# Settings → Environments → github-pages → Deployment branches and tags → a tag rule v*.
name: Demo site

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        run: ./gradlew shadowJar

      - name: Document every sample model
        run: playground/run-sample.sh

      - name: One site, a folder per model, and an index of them
        run: playground/demo-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
