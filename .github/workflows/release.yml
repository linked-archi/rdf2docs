# A release, from a tag: git tag v0.2.0 && git push origin v0.2.0
#
# Builds the jar at the tag's version, attaches it to a GitHub release, pushes the container image to
# ghcr.io/linked-archi/rdf2docs (tagged 0.2.0, 0.2 and latest) and publishes the demo site.
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release
      packages: write   # the image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: The version, from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test and build the jar
        run: ./gradlew -Pversion=${{ steps.version.outputs.version }} test shadowJar

      - name: The jar is the tag's version
        run: java -jar build/libs/rdf2docs-*-all.jar --version | grep -Fx "rdf2docs ${{ steps.version.outputs.version }}"

      # The image for both architectures: the jar is the same, only the Java runtime differs.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}

      - name: The GitHub release, with the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/rdf2docs-*-all.jar \
            --title "rdf2docs ${{ steps.version.outputs.version }}" --generate-notes --verify-tag

  # Called rather than triggered by the release: a release made with the workflow's token starts no other workflow.
  demo:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/demo.yml
