kotlin.code.style=official
# The version of the next release; a release build sets it from its tag (-Pversion=…).
version=0.1.0
org.gradle.jvmargs=-Xmx2g
# ── Java toolchain ────────────────────────────────────────────────
# The build targets Java 25, which RDF4J 6.x requires — the same toolchain the converters use, so
# the whole tool family builds on one JDK.
#
# Gradle discovers JDKs installed on the machine (auto-detect) but will NOT download one: a build
# that silently fetches a JDK hides a missing prerequisite, so instead it fails with "No matching
# toolchain could be found" and you install Java 25 yourself.
#
# Gradle only looks in conventional locations, so a JDK installed elsewhere — Homebrew, for
# instance — may not be found even though it works. Point Gradle at it from your *user*
# gradle.properties (~/.gradle/gradle.properties), not here, since the path is specific to
# your machine:
#
#   org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
# ── Dependency versions (single source of truth) ───────────────────
# Must match the converters' rdf4jVersion: this tool reads the graphs they write.
rdf4jVersion=6.0.0
