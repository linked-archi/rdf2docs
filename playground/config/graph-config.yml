      - https://meta.linked.archi/archimate3/onto#BusinessRole
      - https://meta.linked.archi/archimate3/onto#BusinessCollaboration
      - https://meta.linked.archi/archimate3/onto#BusinessInterface
      - https://meta.linked.archi/archimate3/onto#BusinessProcess
      - https://meta.linked.archi/archimate3/onto#BusinessFunction
      - https://meta.linked.archi/archimate3/onto#BusinessInteraction
      - https://meta.linked.archi/archimate3/onto#BusinessService
      - https://meta.linked.archi/archimate3/onto#BusinessEvent
      - https://meta.linked.archi/archimate3/onto#BusinessObject
      - https://meta.linked.archi/archimate3/onto#Contract
