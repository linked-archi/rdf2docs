# Graph view configuration for rdf2docs
#
# filterGroups: named groups of type IRIs shown as sections in the filter dropdown.
#   Each group has a label and a list of IRIs. Types not assigned to any group are
#   collected automatically into an "Other" group at the end.
#
# excludedNodeTypes: element types whose nodes start UNCHECKED (hidden) in the type filter.
#   All other element types start checked (visible). Relationships are the graph's edges, not nodes: every
#   relationship type starts shown, whatever this list says.
#
# The types are ArchiMate 3.2's, as the converters write them for ArchiSurance
# (playground/run-archimate-model.sh).

excludedNodeTypes:
  - https://meta.linked.archi/archimate3/onto#Grouping
  - https://meta.linked.archi/archimate3/onto#Location

filterGroups:
  - label: Strategy
    iris:
      - https://meta.linked.archi/archimate3/onto#Capability
      - https://meta.linked.archi/archimate3/onto#Resource
      - https://meta.linked.archi/archimate3/onto#ValueStream
      - https://meta.linked.archi/archimate3/onto#CourseOfAction

  - label: Business
    iris:
